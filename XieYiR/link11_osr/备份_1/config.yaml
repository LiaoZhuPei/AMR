# ============================================================
# Link11 开放集识别系统 - 统一配置文件
# ============================================================

# ---------- 数据配置 ----------
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"

  # 正类信号 (Link11 替代)
  target_class: "mt63_1000"

  # 已知负类 (训练时可见)
  known_negatives:
    - "rtty"
    - "ssb"
    - "am"

  # 未知负类 (仅测试，训练不可见)
  unknown_negatives:
    - "psk31"
    - "morse"
    - "olivia"

  # 数据集划分
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42

# ---------- 特征提取配置 ----------
feature:
  type: "spectrogram"        # 可选: spectrogram, mel_spectrogram, cwt
  n_fft: 256
  hop_length: 64
  n_mels: 64                 # 仅 mel_spectrogram 使用
  normalize: true            # 归一化到 [0,1]

# ---------- 模型配置 ----------
model:
  backbone: "cnn2d"          # 可选: cnn1d, cnn2d, resnet（cnn2d=频谱图; cnn1d=原始信号）
  feature_dim: 128           # 特征嵌入维度
  # CNN1D 参数
  cnn1d:
    channels: [32, 64, 128]
    kernel_sizes: [7, 5, 3]
    pool_sizes: [2, 2, 2]
  # CNN2D 参数 (用于时频图)
  cnn2d:
    channels: [16, 32, 64, 128]
    kernel_size: 3

# ---------- 训练配置 ----------
training:
  epochs: 50
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_scheduler: "cosine"     # 可选: step, cosine, none
  patience: 10               # 早停耐心值

  # SVDD 损失配置
  svdd:
    nu: 0.1                  # 异常比例上界 (0,1)，越小球越紧
    warm_up_epochs: 5        # 热身阶段（仅用正类训练球心）

  # 辅助对比损失 (可选，帮助正负类分离)
  use_aux_contrastive: true
  contrastive_margin: 2.0
  lambda_contrastive: 0.3    # 对比损失权重

# ---------- 评估配置 ----------
evaluation:
  # 阈值选择策略
  threshold_strategy: "val_fpr"   # 可选: val_fpr, percentile
  target_fpr: 0.05               # 在验证集上目标假阳性率 5%
  percentile: 95                 # 备用: 正类距离的第95百分位

  metrics:
    - "auroc"
    - "fpr_at_95tpr"
    - "accuracy"
    - "confusion_matrix"

# ---------- 输出配置 ----------
output:
  model_dir: "models"
  results_dir: "results"
  save_best_only: true
  log_interval: 10           # 每N个batch打印一次日志
